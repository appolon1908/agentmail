services:
  agentmail:
    build: .
    env_file:
      - .env
    ports:
      - "8097:8097"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
